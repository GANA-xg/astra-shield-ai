services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: astra-shield-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/citizen-app
      dockerfile: Dockerfile

    container_name: astra-shield-frontend

    ports:
      - "3000:3000"

    restart: unless-stopped

    volumes:
      - ./frontend/citizen-app:/app
      - /app/node_modules

    depends_on:
      - backend